{% extends "base.html" %}

{% block title %}Register - FitAI Pro{% endblock %}

{% block content %}
<div class="container" style="padding-top: 3rem; padding-bottom: 5rem; max-width: 550px;">
  <div class="glass-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2>Join FitAI Pro ⚡</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Start your AI-powered personalized fitness journey</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="username" class="form-control" placeholder="Alex Morgan" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="alex@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Age</label>
          <input type="number" name="age" class="form-control" value="25" required>
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select name="gender" class="form-control">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Height (cm)</label>
          <input type="number" step="0.1" name="height" class="form-control" value="175" required>
        </div>
        <div class="form-group">
          <label>Weight (kg)</label>
          <input type="number" step="0.1" name="weight" class="form-control" value="70" required>
        </div>
      </div>

      <div class="form-group">
        <label>Primary Fitness Goal</label>
        <select name="goal" class="form-control">
          <option value="Gain Muscle">Gain Muscle</option>
          <option value="Lose Fat">Lose Fat</option>
          <option value="Stay Fit">Stay Fit</option>
          <option value="Improve Flexibility">Improve Flexibility</option>
          <option value="Cardio">Cardio</option>
          <option value="Rehabilitation">Rehabilitation</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 1rem;">
        Create Account 🚀
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Already registered? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
